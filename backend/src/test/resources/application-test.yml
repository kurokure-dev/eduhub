# 테스트 프로필. 개발 DB(SQL Server)에 직접 연결한다 (D-15)
# 접속 정보는 dev와 같은 환경 변수(.env)를 쓴다. @DataJpaTest는 테스트마다 롤백하므로 데이터가 남지 않는다
spring:
  config:
    import: optional:file:../.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # Flyway가 만든 스키마와 엔티티가 어긋나면 테스트가 실패하도록 검사만 한다
      ddl-auto: validate
